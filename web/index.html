<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECMWF/GFS天気図ビューア</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ECMWF/GFS天気図ビューア</h1>
  <label>モデル
    <select id="modelSel"></select>
  </label>
  <label>初期値
    <select id="initSel"></select>
  </label>
  <div id="regionBtns" class="seg" role="group" aria-label="地域"></div>
  <button id="btnUpdate" title="RISHから最新データを取得して作図します">最新を取得</button>
  <span id="updateMsg"></span>
  <a href="board/" title="複数の図を並べて表示">画用紙版</a>
  <span id="updated"></span>
</header>

<nav id="chartTabs" role="tablist" aria-label="図種"></nav>

<main>
  <div id="viewer">
    <img id="chartImg" alt="天気図">
    <div id="noData" hidden>この組み合わせの画像はありません</div>
  </div>

  <div id="controls">
    <button id="btnFirst" title="最初 (Home)">⏮</button>
    <button id="btnPrev" title="前 (←)">◀</button>
    <button id="btnPlay" title="再生/停止 (Space)">▶</button>
    <button id="btnNext" title="次 (→)">▶|</button>
    <button id="btnLast" title="最後 (End)">⏭</button>
    <input id="ftSlider" type="range" min="0" max="0" step="1" value="0">
    <select id="speedSel" title="再生速度">
      <option value="900">遅い</option>
      <option value="500" selected>標準</option>
      <option value="250">速い</option>
    </select>
    <a id="dlLink" download title="この画像を保存">保存</a>
  </div>
  <div id="timeInfo"></div>

  <section id="thumbs" aria-label="同じ予報時間の図種一覧"></section>
</main>

<footer>
  <p id="credit" class="credit"></p>
  <section id="legal" aria-label="出典・ライセンス・免責"></section>
  <p>作図: 本アプリ（元データを加工して描画した図）。ショートカット: ←→ 予報時間、↑↓ 図種、Space 再生</p>
</footer>
<script src="app.js"></script>
</body>
</html>
