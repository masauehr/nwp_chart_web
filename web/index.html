<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECMWF/GFS/AIFS天気図ビューア</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>ECMWF/GFS/AIFS天気図ビューア</h1>
  <label><span id="modelLabel">モデル</span>
    <select id="modelSel"></select>
  </label>
  <!-- 2モデル比較: 同じ図種・範囲・予報有効時刻を、2つのモデルで左右に並べて表示する -->
  <label class="cmpToggle" title="同じ要素を2つのモデルで左右に並べて表示します（初期値が違えば予報有効時刻を合わせます）">
    <input type="checkbox" id="cmpChk"> 2モデル比較
  </label>
  <span id="cmpBox" hidden>
    <label>右のモデル <select id="model2Sel"></select></label>
    <button id="btnSwap" title="左右のモデルを入れ替える（予報有効時刻は保つ）">⇄ 入替</button>
  </span>
  <label>初期値
    <select id="initSel"></select>
  </label>
  <div id="regionBtns" class="seg" role="group" aria-label="地域"></div>
  <button id="btnUpdate" title="RISHから最新データを取得して作図します">最新を取得</button>
  <button id="btnSync" title="公開サイトで作られた最新の画像を、手元へ取り込みます（GFS・AIFS・ECMWF）">同期</button>
  <span id="updateMsg"></span>
  <a href="board/" title="複数の図を並べて表示">画用紙版</a>
  <span id="updated"></span>
</header>

<nav id="chartTabs" role="tablist" aria-label="図種"></nav>

<main>
  <div id="controls">
    <button id="btnFirst" title="最初 (Home)">⏮</button>
    <button id="btnPrev" title="1コマ戻る (←)">|◀</button>
    <button id="btnPlay" title="再生/停止 (Space)">再生</button>
    <button id="btnNext" title="1コマ進む (→)">▶|</button>
    <button id="btnLast" title="最後 (End)">⏭</button>
    <input id="ftSlider" type="range" min="0" max="0" step="1" value="0">
    <select id="speedSel" title="再生速度">
      <option value="900">遅い</option>
      <option value="500" selected>標準</option>
      <option value="250">速い</option>
    </select>
    <a id="dlLink" download title="この画像を保存">保存</a>
  </div>
  <div id="timeInfo"></div>

  <div id="views">
    <div class="view" id="view1">
      <div class="cap" id="cap1" hidden></div>
      <div id="viewer" class="viewbox">
        <img id="chartImg" alt="天気図">
        <div id="noData" class="nodata" hidden>この組み合わせの画像はありません</div>
      </div>
    </div>
    <div class="view" id="view2" hidden>
      <div class="cap" id="cap2"><span id="cap2Text"></span><a id="dl2" download title="この画像を保存">保存</a></div>
      <div id="viewer2" class="viewbox">
        <img id="chartImg2" alt="天気図（右）">
        <div id="noData2" class="nodata" hidden>この組み合わせの画像はありません</div>
      </div>
    </div>
  </div>

  <section id="thumbs" aria-label="同じ予報時間の図種一覧"></section>
</main>

<footer>
  <p id="credit" class="credit"></p>
  <section id="legal" aria-label="出典・ライセンス・免責"></section>
  <p>作図: 本アプリ（元データを加工して描画した図）。ショートカット: ←→ 予報時間、↑↓ 図種、Space 再生、C 2モデル比較の切替</p>
</footer>
<script src="app.js"></script>
</body>
</html>
